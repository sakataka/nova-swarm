<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Swarm</title>
  </head>
  <body>
    <main class="shell">
      <div class="cabinet">
        <canvas id="game" width="960" height="720" aria-label="Nova Swarm game canvas"></canvas>
        <div class="keybar">
          <span>MOVE: A/D or ←/→</span>
          <span>SHOT: SPACE</span>
          <span>BOMB: SHIFT/B</span>
          <span>PAUSE: P</span>
          <span>MUTE: M</span>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
